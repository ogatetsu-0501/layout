<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>備品レイアウト確認ツール</title>
  <style>
    html,
    body,
    iframe {
      width: 100%;
      height: 100%;
      margin: 0;
      border: 0;
      overflow: hidden;
    }

    html,
    body {
      height: 100dvh;
    }

    iframe {
      display: block;
    }
  </style>
</head>
<body>
  <iframe id="layoutApp" src="./app.html" title="備品レイアウト確認ツール"></iframe>
  <script>
    'use strict';

    // ===== 距離計測の説明文を現在の操作仕様に合わせます =====
    const oldMeasurementText = '「2備品選択」は2つの備品間の中心距離・最短間隔を確認します。「任意距離を計測」は図面上をドラッグして距離を測ります。';
    const newMeasurementText = '「2備品選択」は2つの備品間の中心距離・最短間隔を確認します。「2点距離を追加」は2点を順番にタップし、タップ位置に最も近いオブジェクトの外端へ自動吸着して距離線を追加します。';
    const layoutApp = document.getElementById('layoutApp');

    layoutApp.addEventListener('load', () => {
      const appDocument = layoutApp.contentDocument;
      if (!appDocument) {
        return;
      }

      const descriptionElements = appDocument.querySelectorAll('.small');
      for (const element of descriptionElements) {
        const isOldMeasurementDescription = element.textContent?.trim() === oldMeasurementText;
        if (!isOldMeasurementDescription) {
          continue;
        }

        element.textContent = newMeasurementText;
        break;
      }
    });
  </script>
</body>
</html>
